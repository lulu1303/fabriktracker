<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FabrikTracker – LEGO Fabrik Günzburg</title>

  <!-- App-Symbol und Vollbild beim Hinzufügen zum Home-Bildschirm -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#d71920">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FabrikTracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/style.css?v=20261017f">
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      🧱 <span>Fabrik</span>Tracker
    </div>

    <div class="header-actions">

      <div class="location">
        📍 Günzburg
      </div>

      <button
        id="adminLoginButton"
        class="admin-login-button"
        onclick="toggleAdminLogin()"
      >
        🔒 Admin
      </button>

    </div>

  </div>

</header>


<main>

  <section class="hero">

    <h1>
      LEGO Fabrik Günzburg
    </h1>

    <div class="subtitle">
      Welche LEGO Teile sind aktuell verfügbar?
    </div>

    <div class="search">

      <input
        id="searchInput"
        type="text"
        placeholder="Teilenummer oder Name suchen..."
        oninput="searchParts()"
      >

      <button
        class="primary"
        onclick="searchParts()"
      >
        Suchen
      </button>

    </div>

  </section>


  <!-- =====================================================
       TEIL MELDEN
       Jetzt direkt unter der Suche und ausklappbar
  ====================================================== -->

  <section
    class="report-box report-open"
    id="reportBox"
  >

    <h2 class="report-title">
      🧱 Teil gesehen?
    </h2>


    <div
      id="reportContent"
      class="report-content"
    >

      <p>
        Hilf anderen LEGO-Fans und melde,
        welche Teile du in der Fabrik gefunden hast.
      </p>


      <button
        id="reportButton"
        class="primary"
        type="button"
        onclick="openReportForm()"
      >
        + Teil melden
      </button>


      <div id="reportArea"></div>


      <div
        id="reportStatus"
        class="status"
      ></div>

    </div>

  </section>


  <!-- =====================================================
       GEMELDETE TEILE
  ====================================================== -->

  <div class="section-title">
    🟢 Aktuell gemeldete Teile
  </div>

  <div class="view-options">

    <label class="view-option-check">
      <input id="optOnlyAvailable" type="checkbox">
      Nur verfügbare
    </label>

    <label class="view-option-check">
      <input id="optOnlyFavorites" type="checkbox">
      ⭐ Nur Favoriten
    </label>

    <label class="view-option-sort">
      Sortierung
      <select id="optSort">
        <option value="default">Standard (nach Größe)</option>
        <option value="recent">Zuletzt gesehen</option>
      </select>
    </label>

  </div>


  <div id="results">

    <div class="card loading">
      Teile werden geladen...
    </div>

  </div>


</main>


<!-- =======================================================
     JAVASCRIPT
======================================================== -->

<script src="js/config.js?v=20261017f"></script>
<script src="js/state.js?v=20261017f"></script>
<script src="js/supabase.js?v=20261017f"></script>
<script src="js/categories.js?v=20261017f"></script>
<script src="js/utils.js?v=20261017f"></script>
<script src="js/parts.js?v=20261017f"></script>
<script src="js/view-options.js?v=20261017f"></script>
<script src="js/extras.js?v=20261017f"></script>
<script src="js/search.js?v=20261017f"></script>
<script src="js/search-rpc.js?v=20261017f"></script>
<script src="js/report.js?v=20261017f"></script>
<script src="js/discounts.js?v=20261017f"></script>
<script src="js/admin.js?v=20261017f"></script>
<script src="js/app.js?v=20261017f"></script>
<script src="js/update-check.js?v=20261017f"></script>

</body>
</html>
