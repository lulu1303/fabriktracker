<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FabrikTracker – LEGO Fabrik Günzburg</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      🧱 <span>Fabrik</span>Tracker
    </div>

    <div class="header-actions">

  <div class="location">
    📍 Günzburg
  </div>

  <button
    id="adminLoginButton"
    class="admin-login-button"
    onclick="toggleAdminLogin()"
  >
    🔒 Admin
  </button>

</div>

  </div>

</header>


<main>

  <section class="hero">

    <h1>
      LEGO Fabrik Günzburg
    </h1>

    <div class="subtitle">
      Welche LEGO Teile sind aktuell verfügbar?
    </div>

    <div class="search">

      <input
        id="searchInput"
        type="text"
        placeholder="Teilenummer oder Name suchen..."
        oninput="searchParts()"
      >

      <button
        class="primary"
        onclick="searchParts()"
      >
        Suchen
      </button>

    </div>

  </section>


  <div class="section-title">
    🟢 Aktuell gemeldete Teile
  </div>


  <div id="results">

    <div class="card loading">
      Teile werden geladen...
    </div>

  </div>


  <section class="report-box">

    <h2>
      🧱 Teil gesehen?
    </h2>

    <p>
      Hilf anderen LEGO-Fans und melde,
      welche Teile du in der Fabrik gefunden hast.
    </p>

    <button
      id="reportButton"
      class="primary"
      onclick="openReportForm()"
    >
      + Teil melden
    </button>

    <div id="reportArea"></div>

    <div
      id="reportStatus"
      class="status"
    ></div>

  </section>

</main>



<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/parts.js"></script>
<script src="js/search.js"></script>
<script src="js/report.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
