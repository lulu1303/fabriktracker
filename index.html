<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FabrikTracker – LEGO Fabrik Günzburg</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      🧱 <span>Fabrik</span>Tracker
    </div>

    <div class="header-actions">

      <div class="location">
        📍 Günzburg
      </div>

      <button
        id="adminLoginButton"
        class="admin-login-button"
        onclick="toggleAdminLogin()"
      >
        🔒 Admin
      </button>

    </div>

  </div>

</header>


<main>

  <section class="hero">

    <h1>
      LEGO Fabrik Günzburg
    </h1>

    <div class="subtitle">
      Welche LEGO Teile sind aktuell verfügbar?
    </div>

    <div class="search">

      <input
        id="searchInput"
        type="text"
        placeholder="Teilenummer oder Name suchen..."
        oninput="searchParts()"
      >

      <button
        class="primary"
        onclick="searchParts()"
      >
        Suchen
      </button>

    </div>

  </section>


  <!-- =====================================================
       TEIL MELDEN
       Jetzt direkt unter der Suche und ausklappbar
  ====================================================== -->

  <section
    class="report-box report-collapsed"
    id="reportBox"
  >

    <button
      id="reportToggleButton"
      class="report-toggle"
      type="button"
      onclick="toggleReportForm()"
      aria-expanded="false"
      aria-controls="reportContent"
    >

      <span class="report-toggle-title">
        🧱 Teil gesehen?
      </span>

      <span
        id="reportToggleIcon"
        class="report-toggle-icon"
      >
        ＋
      </span>

    </button>


    <div
      id="reportContent"
      class="report-content"
      hidden
    >

      <p>
        Hilf anderen LEGO-Fans und melde,
        welche Teile du in der Fabrik gefunden hast.
      </p>


      <button
        id="reportButton"
        class="primary"
        type="button"
        onclick="openReportForm()"
      >
        + Teil melden
      </button>


      <div id="reportArea"></div>


      <div
        id="reportStatus"
        class="status"
      ></div>

    </div>

  </section>


  <!-- =====================================================
       GEMELDETE TEILE
  ====================================================== -->

  <div class="section-title">
    🟢 Aktuell gemeldete Teile
  </div>


  <div id="results">

    <div class="card loading">
      Teile werden geladen...
    </div>

  </div>


</main>


<!-- =======================================================
     TEIL MELDEN – AUSKLAPPLOGIK
======================================================== -->

<script>

function toggleReportForm() {

  const box =
    document.getElementById("reportBox");

  const content =
    document.getElementById("reportContent");

  const button =
    document.getElementById("reportToggleButton");

  const icon =
    document.getElementById("reportToggleIcon");


  if (
    !box ||
    !content
  ) {
    return;
  }


  const isOpen =
    !content.hidden;


  if (isOpen) {

    content.hidden = true;

    box.classList.remove(
      "report-open"
    );

    box.classList.add(
      "report-collapsed"
    );


    if (button) {

      button.setAttribute(
        "aria-expanded",
        "false"
      );

    }


    if (icon) {

      icon.textContent = "＋";

    }

    return;
  }


  content.hidden = false;

  box.classList.remove(
    "report-collapsed"
  );

  box.classList.add(
    "report-open"
  );


  if (button) {

    button.setAttribute(
      "aria-expanded",
      "true"
    );

  }


  if (icon) {

    icon.textContent = "−";

  }

}

</script>


<!-- =======================================================
     JAVASCRIPT
======================================================== -->

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/supabase.js"></script>
<script src="js/categories.js"></script>
<script src="js/utils.js"></script>
<script src="js/parts.js"></script>
<script src="js/search.js"></script>
<script src="js/report.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>

</body>
</html>
