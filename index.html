<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://nmsoppdibanqfaeqtube.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rcf_aY1AfeyRmumUDiNhBw_7LUWdVBD";

const PARTS_URL =
  SUPABASE_URL + "/rest/v1/parts";

const LEGO_PARTS_URL =
  SUPABASE_URL + "/rest/v1/lego_parts";

const COLORS_URL =
  SUPABASE_URL + "/rest/v1/colors";


let parts = [];
let selectedPart = null;
let searchTimer = null;


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(url, options = {}) {

  const response = await fetch(url, {

    ...options,

    headers: {

      "apikey": SUPABASE_KEY,

      "Authorization":
        "Bearer " + SUPABASE_KEY,

      "Content-Type":
        "application/json",

      ...(options.headers || {})

    }

  });


  let data = null;

  try {
    data = await response.json();
  } catch {
    data = null;
  }


  if (!response.ok) {

    const message =
      data?.message ||
      data?.error ||
      ("HTTP Fehler " + response.status);

    const error = new Error(message);

    error.code =
      data?.code ||
      String(response.status);

    throw error;
  }


  return data;
}


/* =========================================================
   HTML ESCAPEN
========================================================= */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   TEILE LADEN
========================================================= */

async function loadParts() {

  const container =
    document.getElementById("results");


  container.innerHTML = `
    <div class="card loading">
      Teile werden geladen...
    </div>
  `;


  try {

    const data =
      await supabaseRequest(
        PARTS_URL +
        "?select=*&order=created_at.desc"
      );


    parts = data || [];

/* Farbnamen laden */
if (parts.length > 0) {

  const colorIds = [
    ...new Set(
      parts
        .map(part => part.color_id)
        .filter(
          id =>
            id !== null &&
            id !== undefined
        )
    )
  ];

  if (colorIds.length > 0) {

    const colorsUrl =
      SUPABASE_URL +
      "/rest/v1/lego_colors" +
      "?id=in.(" +
      colorIds.join(",") +
      ")" +
      "&select=id,name";

    const colors =
      await supabaseRequest(colorsUrl);

    const colorMap = {};

    (colors || []).forEach(color => {
      colorMap[color.id] = color.name;
    });

    parts.forEach(part => {
      part.color_name =
        colorMap[part.color_id] || "";
    });

  }

}

displayParts(parts);


  } catch (error) {

    console.error(error);

    showError(
      "Supabase-Fehler beim Laden",
      error.message || "Unbekannter Fehler"
    );

  }

}


/* =========================================================
   TEILE ANZEIGEN
========================================================= */

function displayParts(list) {

  const container =
    document.getElementById("results");


  if (!list || list.length === 0) {

    container.innerHTML = `
      <div class="card empty">
        Noch keine Teile gemeldet.
      </div>
    `;

    return;
  }


  container.innerHTML =
    list.map(part => {

      const number =
        escapeHTML(
          part.part_number || ""
        );

      const name =
        escapeHTML(
          part.name || ""
        );

      const category =
        escapeHTML(
          part.category || ""
        );
      const color =
        escapeHTML(
          part.color_name || ""
        );


      let date = "";


      if (part.created_at) {

        try {

          date =
            new Date(
              part.created_at
            ).toLocaleString(
              "de-DE"
            );

        } catch {

          date = "";

        }

      }


      return `

        <div class="card">

          <div class="part-header">

            <div>

              <div class="part-number">
                LEGO ${number}
              </div>

              <div class="part-name">

        ${name}

        ${  
          category
            ? " · " + category
            : ""
        }

        ${
          color
            ? " · 🎨 " + color
            : ""
        }

      </div>  

            </div>


            <div class="available">
              ● Verfügbar
            </div>

          </div>


          <div class="details">

            📍 LEGO Fabrik Günzburg

            ${
              date
                ? "<br>🕐 " + date
                : ""
            }

          </div>


          <button
            class="secondary confirm"
            onclick="confirmPart('${escapeHTML(part.part_number || "")}')"
          >
            👍 Ich habe dieses Teil auch gesehen
          </button>

        </div>

      `;

    }).join("");

}


/* =========================================================
   HAUPTSUCHE
========================================================= */

function searchParts() {

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value
      .toLowerCase()
      .trim();


  if (!query) {

    displayParts(parts);

    return;

  }


  const filtered =
    parts.filter(part => {

      const number =
        String(
          part.part_number || ""
        ).toLowerCase();

      const name =
        String(
          part.name || ""
        ).toLowerCase();

      const category =
        String(
          part.category || ""
        ).toLowerCase();


      return (

        number.includes(query) ||

        name.includes(query) ||

        category.includes(query)

      );

    });


  displayParts(filtered);

}


/* =========================================================
   MELDEFORMULAR ÖFFNEN
========================================================= */

function openReportForm() {

  const area =
    document.getElementById(
      "reportArea"
    );


  if (area.innerHTML) {

    area.innerHTML = "";

    return;

  }


  area.innerHTML = `

    <div class="report-form">

      <div class="field">

        <label>
          Teilenummer oder Name
        </label>

        <input
          id="partSearchInput"
          type="text"
          autocomplete="off"
          placeholder="z.B. 3001 oder Brick 2 x 4"
          oninput="searchLegoParts()"
        >

        <div
          id="partSuggestions"
          class="suggestions"
          style="display:none;"
        ></div>

        <div
          id="selectedPart"
        ></div>

        <div
          id="partSearchError"
          class="search-error"
        ></div>

      </div>


      <div class="field">

        <label>
          Farbe
        </label>

        <select
          id="colorSelect"
          disabled
        >

          <option value="">
            Erst Teil auswählen...
          </option>

        </select>

      </div>


      <div class="form-buttons">

        <button
          class="secondary"
          onclick="closeReportForm()"
        >
          Abbrechen
        </button>

        <button
          id="submitReportButton"
          class="primary"
          onclick="submitReport()"
          disabled
        >
          Teil melden
        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   TEILESUCHE IN LEGO_PARTS
========================================================= */

function searchLegoParts() {

  clearTimeout(searchTimer);


  const input =
    document.getElementById(
      "partSearchInput"
    );


  const query =
    input.value
      .trim();


  selectedPart = null;


  const selected =
    document.getElementById(
      "selectedPart"
    );


  const colorSelect =
    document.getElementById(
      "colorSelect"
    );


  const submitButton =
    document.getElementById(
      "submitReportButton"
    );


  if (selected) {
    selected.innerHTML = "";
  }


  if (colorSelect) {
    colorSelect.disabled = true;
  }


  if (submitButton) {
    submitButton.disabled = true;
  }


  if (query.length < 2) {

    hideSuggestions();

    return;

  }


  searchTimer =
    setTimeout(
      () => fetchLegoPartSuggestions(query),
      300
    );

}


/* =========================================================
   SUCHVARIANTEN
========================================================= */

function createSearchVariants(query) {

  const variants = new Set();

  const clean =
    query
      .trim()
      .toLowerCase();


  if (!clean) {
    return [];
  }


  variants.add(clean);


  /*
    Aus "2x4" wird zusätzlich "2 x 4"
  */

  variants.add(
    clean.replace(
      /(\d)\s*x\s*(\d)/gi,
      "$1 x $2"
    )
  );


  /*
    Aus "2 x 4" wird zusätzlich "2x4"
  */

  variants.add(
    clean.replace(
      /(\d)\s*x\s*(\d)/gi,
      "$1x$2"
    )
  );


  /*
    Mehrfache Leerzeichen entfernen
  */

  variants.add(
    clean.replace(
      /\s+/g,
      " "
    )
  );


  return [...variants];

}


/* =========================================================
   LEGO TEILE AUS SUPABASE SUCHEN
========================================================= */

async function fetchLegoPartSuggestions(query) {

  const suggestions =
    document.getElementById("partSuggestions");

  const errorBox =
    document.getElementById("partSearchError");

  if (!suggestions) {
    return;
  }


  suggestions.style.display = "block";

  suggestions.innerHTML = `
    <div class="suggestion">
      🔎 Suche Teile...
    </div>
  `;


  if (errorBox) {
    errorBox.textContent = "";
  }


  try {

    const search =
      query
        .trim()
        .toLowerCase();


    if (search.length < 2) {

      hideSuggestions();

      return;

    }


    let results = [];


    /*
     * ==========================================
     * 1. TEILENUMMER
     * ==========================================
     *
     * Beispiel:
     * 3001
     */

    if (/^[0-9]+$/.test(search)) {

      const url =
        LEGO_PARTS_URL +
        "?part_num=eq." +
        encodeURIComponent(search) +
        "&select=part_num,name,category" +
        "&limit=20";


      const data =
        await supabaseRequest(url);


      results =
        data || [];

    }


    /*
     * ==========================================
     * 2. NAME
     * ==========================================
     *
     * Beispiele:
     *
     * Brick 2 x 4
     * Brick 2x4
     * Plate 2 x 4
     * Tile 1 x 2
     */

    if (results.length === 0) {

      /*
       * Suchtext normalisieren
       */

      const normalized =
        search
          .replace(
            /\s*x\s*/gi,
            " x "
          )
          .replace(
            /\s+/g,
            " "
          )
          .trim();


      /*
       * Normale Namenssuche
       */

      const nameUrl =
        LEGO_PARTS_URL +
        "?name=ilike." +
        encodeURIComponent(
          "%" + normalized + "%"
        ) +
        "&select=part_num,name,category" +
        "&limit=100";


      results =
        await supabaseRequest(
          nameUrl
        );


      /*
       * Zusätzlich kompakte Schreibweise
       *
       * 2 x 4
       * →
       * 2x4
       */

      if (
        (!results || results.length === 0) &&
        normalized.includes(" x ")
      ) {

        const compact =
          normalized.replace(
            /\s*x\s*/gi,
            "x"
          );


        const compactUrl =
          LEGO_PARTS_URL +
          "?name=ilike." +
          encodeURIComponent(
            "%" + compact + "%"
          ) +
          "&select=part_num,name,category" +
          "&limit=100";


        results =
          await supabaseRequest(
            compactUrl
          );

      }

    }


    /*
     * ==========================================
     * 3. KEINE ERGEBNISSE
     * ==========================================
     */

    if (
      !results ||
      results.length === 0
    ) {

      suggestions.innerHTML = `
        <div class="suggestion">
          ❌ Kein passendes LEGO Teil gefunden.
        </div>
      `;

      return;

    }


    /*
     * ==========================================
     * 4. PRIORITÄT BERECHNEN
     * ==========================================
     *
     * Ziel:
     *
     * "Brick 2 x 4"
     *
     * soll möglichst so aussehen:
     *
     * 🥇 3001 Brick 2 x 4
     * 🥈 weitere normale LEGO Bricks
     * 🥉 Varianten
     * ⬇️ DUPLO / bedruckt / Spezialteile
     *
     */


    function getPartPriority(part) {

      const number =
        String(
          part.part_num || ""
        ).toLowerCase();


      const name =
        String(
          part.name || ""
        ).toLowerCase();


      const category =
        String(
          part.category || ""
        ).toLowerCase();


      let priority = 100;


      /*
       * ======================================
       * STANDARD LEGO
       * ======================================
       */

      priority = 100;


      /*
       * DUPLO nach unten
       */

      if (
        name.includes("duplo") ||
        category.includes("duplo") ||
        number.includes("duplo")
      ) {

        priority += 1000;

      }


      /*
       * EDUCATION nach unten
       */

      if (
        name.includes("education") ||
        category.includes("education")
      ) {

        priority += 700;

      }


      /*
       * BEDRUCKTE TEILE nach unten
       */

      if (
        name.includes("printed") ||
        name.includes("print") ||
        name.includes("pattern") ||
        name.includes("decorated") ||
        name.includes("decoration")
      ) {

        priority += 500;

      }


      /*
       * SPEZIALVARIANTEN nach unten
       */

      if (
        name.includes("modified") ||
        name.includes("special") ||
        name.includes("assembly") ||
        name.includes("with ")
      ) {

        priority += 250;

      }


      /*
       * ======================================
       * KATEGORIE PRIORITÄT
       * ======================================
       *
       * Standard Bricks / Plates / Tiles
       * sollen bevorzugt werden.
       */

      const standardCategories = [

        "brick",
        "bricks",

        "plate",
        "plates",

        "tile",
        "tiles",

        "slope",
        "slopes",

        "wedge",

        "technic",

        "bar",

        "round",

        "basic"

      ];


      if (
        standardCategories.some(
          categoryName =>
            category === categoryName ||
            category.includes(
              categoryName
            )
        )
      ) {

        priority -= 100;

      }


      /*
       * ======================================
       * EXAKTER NAME
       * ======================================
       *
       * Wenn der Nutzer beispielsweise
       * "brick 2 x 4" sucht, soll ein
       * exakt passender Name ganz oben stehen.
       */

      const normalizedName =
        name
          .replace(
            /\s+/g,
            " "
          )
          .trim();


      const normalizedSearch =
        search
          .replace(
            /\s*x\s*/gi,
            " x "
          )
          .replace(
            /\s+/g,
            " "
          )
          .trim();


      if (
        normalizedName ===
        normalizedSearch
      ) {

        priority -= 500;

      }


      /*
       * Name beginnt exakt mit Suche
       */

      else if (
        normalizedName.startsWith(
          normalizedSearch
        )
      ) {

        priority -= 250;

      }


      /*
       * ======================================
       * STANDARD-BEISPIEL:
       *
       * Brick 2 x 4
       *
       * LEGO 3001 Brick 2 x 4
       * soll sehr weit oben stehen.
       * ======================================
       */

      if (
        normalizedName.includes(
          normalizedSearch
        )
      ) {

        priority -= 100;

      }


      return priority;

    }


    /*
     * ==========================================
     * 5. SORTIEREN
     * ==========================================
     */

    results.sort(
      (a, b) => {

        const priorityA =
          getPartPriority(a);

        const priorityB =
          getPartPriority(b);


        /*
         * Zuerst Priorität
         */

        if (
          priorityA !== priorityB
        ) {

          return (
            priorityA -
            priorityB
          );

        }


        /*
         * Danach alphabetisch
         */

        const nameA =
          String(
            a.name || ""
          ).toLowerCase();


        const nameB =
          String(
            b.name || ""
          ).toLowerCase();


        return nameA.localeCompare(
          nameB
        );

      }
    );


    /*
     * ==========================================
     * 6. MAXIMAL 20 VORSCHLÄGE
     * ==========================================
     */

    results =
      results.slice(
        0,
        20
      );


    /*
     * ==========================================
     * 7. ANZEIGEN
     * ==========================================
     */

    suggestions.innerHTML =
      results
        .map(part => {

          const number =
            escapeHTML(
              part.part_num || ""
            );


          const name =
            escapeHTML(
              part.name || ""
            );


          const category =
            escapeHTML(
              part.category || ""
            );


          return `

            <div
              class="suggestion"
              onclick='selectLegoPart(${JSON.stringify({
                part_num:
                  part.part_num || "",

                name:
                  part.name || "",

                category:
                  part.category || ""
              })})'
            >

              <div class="suggestion-number">

                LEGO ${number}

              </div>


              <div class="suggestion-name">

                ${name}

                ${
                  category
                    ? " · " + category
                    : ""
                }

              </div>

            </div>

          `;

        })
        .join("");


  } catch (error) {

    console.error(
      "LEGO-Teilesuche Fehler:",
      error
    );


    suggestions.innerHTML =
      "";


    if (errorBox) {

      errorBox.textContent =
        "❌ Fehler bei der Teilesuche: " +
        (
          error.message ||
          "Unbekannter Fehler"
        );

    }

  }

}
/* =========================================================
   TEIL AUS SUCHERGEBNIS AUSWÄHLEN
========================================================= */

async function selectLegoPart(part) {

  selectedPart = part;


  const input =
    document.getElementById(
      "partSearchInput"
    );


  const suggestions =
    document.getElementById(
      "partSuggestions"
    );


  const selected =
    document.getElementById(
      "selectedPart"
    );


  if (input) {

    input.value =
      part.part_num +
      " – " +
      part.name;

  }


  if (suggestions) {

    suggestions.style.display =
      "none";

  }


  if (selected) {

    selected.innerHTML = `

      <div class="selected-part">

        ✅ LEGO ${escapeHTML(
          part.part_num
        )}

        – 

        ${escapeHTML(
          part.name
        )}

      </div>

    `;

  }


  await loadColorsForPart(
    part.part_num
  );

}


/* =========================================================
   FARBEN FÜR TEIL LADEN
========================================================= */

async function loadColorsForPart(partNumber) {

  const colorSelect =
    document.getElementById(
      "colorSelect"
    );

  const submitButton =
    document.getElementById(
      "submitReportButton"
    );

  if (!colorSelect) {
    return;
  }

  colorSelect.disabled = true;

  colorSelect.innerHTML = `
    <option value="">
      Farben werden geladen...
    </option>
  `;

  if (submitButton) {
    submitButton.disabled = true;
  }

  try {

    /*
     * ==========================================
     * 1. VERFÜGBARE FARBEN FÜR DAS TEIL HOLEN
     * ==========================================
     *
     * Beispiel:
     *
     * 3001 → 0
     * 3001 → 1
     * 3001 → 2
     *
     */

    const partColorUrl =
      SUPABASE_URL +
      "/rest/v1/lego_part_colors" +

      "?select=color_id" +

      "&part_num=eq." +
      encodeURIComponent(partNumber);

    const partColors =
      await supabaseRequest(
        partColorUrl
      );


    if (
      !partColors ||
      partColors.length === 0
    ) {

      colorSelect.innerHTML = `
        <option value="">
          Keine Farben gefunden
        </option>
      `;

      return;
    }


    /*
     * ==========================================
     * 2. COLOR IDS SAMMELN
     * ==========================================
     */

    const colorIds =
      [
        ...new Set(
          partColors
            .map(row => row.color_id)
            .filter(
              id =>
                id !== null &&
                id !== undefined
            )
        )
      ];


    if (colorIds.length === 0) {

      colorSelect.innerHTML = `
        <option value="">
          Keine Farben gefunden
        </option>
      `;

      return;
    }


    /*
     * ==========================================
     * 3. NAMEN AUS lego_colors HOLEN
     * ==========================================
     */

    const idList =
      colorIds.join(",");


    const colorsUrl =
      SUPABASE_URL +
      "/rest/v1/lego_colors" +

      "?id=in.(" +
      encodeURIComponent(idList) +
      ")" +

      "&select=id,name" +

      "&order=id.asc";


    const colors =
      await supabaseRequest(
        colorsUrl
      );


    /*
     * ==========================================
     * 4. DROPDOWN AUFBAUEN
     * ==========================================
     */

    colorSelect.innerHTML = `
      <option value="">
        Farbe auswählen...
      </option>
    `;


    if (
      !colors ||
      colors.length === 0
    ) {

      colorSelect.innerHTML = `
        <option value="">
          Keine Farben gefunden
        </option>
      `;

      return;
    }


    /*
     * ==========================================
     * FARBEN EINTRAGEN
     * ==========================================
     */

    colors.forEach(color => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        color.id;

      option.textContent =
        color.name;

      colorSelect.appendChild(
        option
      );

    });


    /*
     * ==========================================
     * DROPDOWN AKTIVIEREN
     * ==========================================
     */

    colorSelect.disabled =
      false;


    colorSelect.onchange =
      function() {

        if (submitButton) {

          submitButton.disabled =
            !this.value;

        }

      };


  } catch (error) {

    console.error(
      "Farben laden Fehler:",
      error
    );


    colorSelect.innerHTML = `
      <option value="">
        Fehler beim Laden der Farben
      </option>
    `;


    colorSelect.disabled =
      true;


    if (submitButton) {
      submitButton.disabled =
        true;
    }

  }

}
/* =========================================================
   TEIL MELDEN
========================================================= */

async function submitReport() {

  const button =
    document.getElementById(
      "submitReportButton"
    );


  const colorSelect =
    document.getElementById(
      "colorSelect"
    );


  if (!selectedPart) {

    alert(
      "Bitte zuerst ein LEGO Teil auswählen."
    );

    return;

  }


  if (
    !colorSelect ||
    !colorSelect.value
  ) {

    alert(
      "Bitte zuerst eine Farbe auswählen."
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Wird gespeichert...";


  try {

    /*
      Wir speichern die Meldung
      in der parts-Tabelle.

      Falls deine parts-Tabelle
      andere Spalten hat, passen
      wir diesen Block anschließend
      gezielt an.
    */


    await supabaseRequest(

      PARTS_URL,

      {

        method: "POST",

        headers: {

          "Prefer":
            "return=representation"

        },

        body:
  JSON.stringify({

    part_number:
      selectedPart.part_num,

    name:
      selectedPart.name,

    category:
      selectedPart.category || "",

    color_id:
      Number(colorSelect.value)

  })

      }

    );


    alert(
      "Danke! Das Teil wurde erfolgreich gemeldet. 🧱"
    );


    closeReportForm();

    await loadParts();


  } catch (error) {

    console.error(
      "Supabase INSERT Fehler:",
      error
    );


    alert(

      "Das Teil konnte leider nicht gespeichert werden.\n\n" +

      "Supabase Fehler:\n" +

      (
        error.message ||
        "Unbekannter Fehler"
      ) +

      "\n\nCode: " +

      (
        error.code ||
        "unbekannt"
      )

    );


  } finally {

    button.disabled =
      false;

    button.textContent =
      "Teil melden";

  }

}


/* =========================================================
   MELDEFORMULAR SCHLIESSEN
========================================================= */

function closeReportForm() {

  const area =
    document.getElementById(
      "reportArea"
    );


  area.innerHTML = "";


  selectedPart =
    null;

}


/* =========================================================
   SUCHVORSCHLÄGE SCHLIESSEN
========================================================= */

function hideSuggestions() {

  const suggestions =
    document.getElementById(
      "partSuggestions"
    );


  if (suggestions) {

    suggestions.style.display =
      "none";

  }

}


/* =========================================================
   BESTÄTIGUNG
========================================================= */

function confirmPart(number) {

  alert(
    "Danke! Deine Bestätigung für Teil " +
    number +
    " wurde registriert. 👍"
  );

}


/* =========================================================
   FEHLER
========================================================= */

function showError(title, message) {

  const container =
    document.getElementById(
      "results"
    );


  container.innerHTML = `

    <div class="card error">

      <div class="error-title">
        ${escapeHTML(title)}
      </div>

      <div>
        ${escapeHTML(message)}
      </div>

    </div>

  `;

}


/* =========================================================
   START
========================================================= */

window.addEventListener(
  "load",
  function() {

    console.log(
      "FabrikTracker gestartet."
    );

    loadParts();

  }
);


/* =========================================================
   KLICK AUSSERHALB DER VORSCHLÄGE
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const field =
      document.querySelector(
        ".field"
      );


    const suggestions =
      document.getElementById(
        "partSuggestions"
      );


    if (
      field &&
      suggestions &&
      !field.contains(event.target)
    ) {

      suggestions.style.display =
        "none";

    }

  }
);

</script>
